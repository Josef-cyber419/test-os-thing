# Hearth home screen layout.
#
# To customise without rebuilding the image, copy this file to
# ~/.config/hearth/apps.toml and edit it; the copy replaces this one.
#
# Each app needs `id`, `name`, and either `command` (string or list) or
# `flatpak` (a Flathub app ID, run with `flatpak run`). Optional keys:
#   args     extra arguments appended to the command
#   color    tile color, e.g. "#1b2838"
#   icon     path to a PNG shown on the tile
#   requires commands that must exist on PATH, or the tile is hidden
#   requires_files  files that must exist, or the tile is hidden (globs and ~ allowed)
#   confirm  ask "are you sure?" first (power actions)
#   home_button  false = don't close the app when Guide is held (default true)
#
# Tiles whose flatpak or required command isn't installed are hidden
# automatically, so it's fine to list apps you haven't installed yet.
# The last row is where the controller's Start/Menu button jumps to.

title = "Hearth"

[[rows]]
title = "Play"

  [[rows.apps]]
  id = "steam"
  name = "Steam"
  command = "/usr/libexec/hearth/hearth-steam"
  requires = ["steam"]
  # Steam uses the Guide button itself; leave via Steam's "Switch to Desktop".
  home_button = false
  color = "#1b2838"

  [[rows.apps]]
  # ES-DE: one menu, a tile per console you've added games for.
  # Installed per user by hearth-esde-update; see docs/EMULATION.md.
  id = "emulation"
  name = "Emulation"
  command = "/usr/libexec/hearth/hearth-emulation"
  requires_files = ["~/Applications/ES-DE.AppImage"]
  color = "#6b2fa0"

  [[rows.apps]]
  id = "moonlight"
  name = "Moonlight"
  flatpak = "com.moonlight_stream.Moonlight"
  color = "#3c4a5c"

  [[rows.apps]]
  # A console (PS5, Switch 2, Xbox...) plugged into an Elgato capture card,
  # shown full screen. Appears when the card is plugged in. For other brands,
  # change the pattern here and set CAPTURE_DEVICE in /etc/hearth/capture.conf.
  id = "hdmi-in"
  name = "HDMI Input"
  command = "/usr/libexec/hearth/hearth-capture"
  requires_files = ["/dev/v4l/by-id/usb-Elgato*-video-index0"]
  color = "#8a5a00"

[[rows]]
title = "Watch"

  [[rows.apps]]
  id = "kodi"
  name = "Kodi"
  flatpak = "tv.kodi.Kodi"
  color = "#17b2e7"

  [[rows.apps]]
  # VacuumTube wraps YouTube's own TV/console interface, so it works with a
  # controller or remote the same way YouTube does on a smart TV.
  id = "youtube"
  name = "YouTube"
  flatpak = "rocks.shy.VacuumTube"
  color = "#c4302b"

  [[rows.apps]]
  id = "jellyfin"
  name = "Jellyfin"
  flatpak = "org.jellyfin.JellyfinDesktop"
  args = ["--tv", "--fullscreen"]
  color = "#5a3e8f"

  [[rows.apps]]
  id = "plex"
  name = "Plex"
  flatpak = "tv.plex.PlexHTPC"
  color = "#cc7b19"

  [[rows.apps]]
  # Android apps via Waydroid, using Bazzite's Game Mode launcher. Hidden
  # until Android is set up (`ujust setup-waydroid`); see docs/STREAMING.md.
  id = "android"
  name = "Android"
  command = "/usr/bin/waydroid-launcher"
  requires = ["waydroid"]
  requires_files = ["/var/lib/waydroid/waydroid.cfg"]
  color = "#2e7d32"

[[rows]]
title = "System"

  [[rows.apps]]
  id = "desktop"
  name = "Desktop Mode"
  command = "/usr/libexec/hearth/hearth-desktop"
  confirm = true
  color = "#2d5f8b"

  [[rows.apps]]
  id = "sleep"
  name = "Sleep"
  command = "systemctl suspend"
  color = "#3a3f58"

  [[rows.apps]]
  id = "restart"
  name = "Restart"
  command = "systemctl reboot"
  confirm = true
  color = "#3a3f58"

  [[rows.apps]]
  id = "poweroff"
  name = "Power Off"
  command = "systemctl poweroff"
  confirm = true
  color = "#5c2a2a"
