# HDMI capture card settings for the "HDMI Input" tile (hearth-capture).
# Empty values mean "detect automatically".

# Video device. Default: the first Elgato card found.
CAPTURE_DEVICE=
# Resolution and frame rate to request from the card. Elgato 4K X / 4K S can
# do 3840x2160 at 60; HD60 X tops out at 1920x1080 at 60 (4K30).
CAPTURE_SIZE=1920x1080
CAPTURE_FPS=60
# Pixel format, e.g. nv12 or yuyv422. Empty lets the card choose.
CAPTURE_FORMAT=
# PipeWire audio source name (see `pactl list short sources`).
# Default: the capture card's own audio input.
CAPTURE_AUDIO=
