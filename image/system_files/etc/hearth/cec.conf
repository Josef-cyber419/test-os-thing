# HDMI-CEC behaviour (only used if a CEC adapter such as the Pulse-Eight
# USB-CEC is plugged in). 1 = on, 0 = off.

# Turn the TV on and switch it to this input on boot and wake from sleep.
TV_WAKE=1
# Put the TV in standby when this PC sleeps or shuts down.
TV_STANDBY=1
# Name shown in the TV's input/device list.
OSD_NAME=Hearth
